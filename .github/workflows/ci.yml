name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^22.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check
      - run: pnpm lint
      - run: pnpm test
