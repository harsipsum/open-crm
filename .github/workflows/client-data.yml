name: Client data and secrets
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: data-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-client-data.mjs
      - name: Plain words, no hedging
        run: node scripts/check-plain-words.mjs
      - name: Gitleaks current source tree (redacted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.0 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.0_linux_x64.tar.gz' --pattern 'gitleaks_8.30.0_checksums.txt' --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          grep ' gitleaks_8.30.0_linux_x64.tar.gz$' gitleaks_8.30.0_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact=100 --no-banner
